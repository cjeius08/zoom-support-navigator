name: Import Approved Ozzie Logo Assets
on:
  push:
    branches: [ozzie-lock-official-logo-20261015]
    paths: [.github/workflows/import-ozzie-approved-logo.yml]
permissions:
  contents: write
jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ozzie-lock-official-logo-20261015
      - name: Download exactly approved transparent logo images
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl -fLsS --retry 3 --max-time 120 'https://2ce096ff-f0de-4eb3-8bc8-37363ca818d6.sandbox.floot.app/_cdn/static/4824b821-5a4c-4220-b09e-744323abe413-ozzie-official-full-logo-approved.png' -o public/assets/ozzie-official-full.png
          curl -fLsS --retry 3 --max-time 120 'https://2ce096ff-f0de-4eb3-8bc8-37363ca818d6.sandbox.floot.app/_cdn/static/0212f2b2-e1e7-40c5-a649-c5bd83a87225-ozzie-official-owl-icon-approved.png' -o public/assets/ozzie-official-owl.png
          curl -fLsS --retry 3 --max-time 120 'https://2ce096ff-f0de-4eb3-8bc8-37363ca818d6.sandbox.floot.app/_cdn/static/184589fa-b4f3-4671-bfbb-2709593636fe-ozzie-official-favicon-256.png' -o public/assets/ozzie-official-favicon.png
          cat > /tmp/ozzie-image-hashes.txt <<'EOF'
          8477f94e6b66fd5871e2871078cc0988d7ed9411fda834aca57dcffd653d868f  public/assets/ozzie-official-full.png
          5b9587f265fa8e62ce86a14792284868cd98dccb23a37f8b4021a5009ca7a564  public/assets/ozzie-official-owl.png
          3fa10cf825842de439c7078be2d449db0484faeab71f7a306804fdfdfea1483d  public/assets/ozzie-official-favicon.png
          EOF
          sha256sum -c /tmp/ozzie-image-hashes.txt
          file public/assets/ozzie-official-full.png public/assets/ozzie-official-owl.png public/assets/ozzie-official-favicon.png
      - name: Commit verified official image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ozzie-official-full.png public/assets/ozzie-official-owl.png public/assets/ozzie-official-favicon.png
          if ! git diff --cached --quiet; then
            git commit -m "Add exact approved Ozzie logo and owl brand assets"
            git push origin HEAD:ozzie-lock-official-logo-20261015
          fi
