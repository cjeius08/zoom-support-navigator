name: Stage Ozzie brand assets

on:
  push:
    branches:
      - phase8/batch1-ozzie-branding
    paths:
      - .github/workflows/stage-ozzie-assets.yml

permissions:
  contents: write

jobs:
  stage-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8/batch1-ozzie-branding
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Download exact supplied artwork
        shell: bash
        run: |
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/609e48f9-59ff-4142-b82c-f2f1e08f6c1f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWY1MzRiZjAwZjZlYWY3YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg5NTE1Mn0.itVV1zrSgewF2917G2M6G2l5Kfms4ch7Lg1IOB-aAT0' -o /tmp/ozzie-login.png
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/aa0f1a4f-c68a-4b80-823d-f4cf631f795e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTg2ZGM5NDBlYTY4MjI5YyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTkyNjk3Nn0.kECGybaBnX2D-y-eySRlupGygMHM__0CBbuWCZKcbWY' -o /tmp/ozzie-pointer.png
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/ee10fee5-236c-4771-8edd-75675f70618e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTI5NjlhMTc1MzgyNjkwYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg2OTQ2M30.tH0PQbKVT_Oluv1QBKeiUnAzqJmtbXskGuT-wS-Nmy8' -o /tmp/ozzie-success.png
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/e0f16a11-820d-4194-8e69-7f33a63c1de1.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODU1Yjc0OTM0MTI2OWI1NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg5Nzc0N30.fUqgZd0MRLUJriMx4mz0XQU6uo66ore8tQ2bGduMpLE' -o /tmp/ozzie-header.png
      - name: Optimize transparent assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          jobs = [
              ('/tmp/ozzie-login.png', 'public/assets/ozzie-login.webp', 520, 84, 20),
              ('/tmp/ozzie-pointer.png', 'public/assets/ozzie-activation-pointer.webp', 360, 84, 8),
              ('/tmp/ozzie-success.png', 'public/assets/ozzie-activation-success.webp', 360, 84, 8),
              ('/tmp/ozzie-header.png', 'public/assets/ozzie-header.webp', 420, 84, 20),
          ]
          Path('public/assets').mkdir(parents=True, exist_ok=True)
          for src, dest, width, quality, threshold in jobs:
              image = Image.open(src).convert('RGBA')
              alpha = image.getchannel('A')
              mask = alpha.point(lambda px, t=threshold: 255 if px >= t else 0)
              bbox = mask.getbbox()
              if bbox:
                  image = image.crop(bbox)
              height = round(image.height * width / image.width)
              image = image.resize((width, height), Image.Resampling.LANCZOS)
              image.save(dest, 'WEBP', quality=quality, method=6)
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ozzie-*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add Ozzie brand artwork"
          git push origin HEAD:phase8/batch1-ozzie-branding
