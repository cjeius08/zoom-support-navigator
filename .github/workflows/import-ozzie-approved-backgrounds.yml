name: Import Approved Ozzie Backgrounds
on:
  push:
    branches: [ozzie-day-night-mode-20261015]
    paths: [.github/workflows/import-ozzie-approved-backgrounds.yml]
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ozzie-day-night-mode-20261015
      - name: Download exact approved backgrounds
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl -fLsS --retry 3 --max-time 120 'https://2ce096ff-f0de-4eb3-8bc8-37363ca818d6.sandbox.floot.app/_cdn/static/3c776fe5-2040-4946-ae72-1481ef0b6610-ozzie-day-crisp-2026.png' -o public/assets/ozzie-day-office.png
          curl -fLsS --retry 3 --max-time 120 'https://2ce096ff-f0de-4eb3-8bc8-37363ca818d6.sandbox.floot.app/_cdn/static/555cbb85-3155-4719-bf3a-f3568e784b57-ozzie-night-crisp-2026.png' -o public/assets/ozzie-night-library.png
          file public/assets/ozzie-day-office.png public/assets/ozzie-night-library.png
          test "$(wc -c < public/assets/ozzie-day-office.png)" -ge 1500000
          test "$(wc -c < public/assets/ozzie-night-library.png)" -ge 1500000
      - name: Commit approved image assets to Ozzie repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ozzie-day-office.png public/assets/ozzie-night-library.png
          if ! git diff --cached --quiet; then git commit -m "Store approved crisp Day and Night office backgrounds"; git push origin HEAD:ozzie-day-night-mode-20261015; fi
