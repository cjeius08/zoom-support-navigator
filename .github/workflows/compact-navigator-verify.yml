name: Compact Navigator Verify

on:
  push:
    branches: [ogcon-compact-navigator]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
