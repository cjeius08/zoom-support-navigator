name: Ozzie isolated layout verification
on:
  push:
    branches: [codex/ozzie-layout-restoration-20260920]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/layout-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozzie-layout-evidence
          path: layout-evidence/
