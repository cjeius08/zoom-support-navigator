name: Import exact Ozzie intro video

on:
  push:
    paths:
      - .github/workflows/import-ozzie-video.yml

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact uploaded video
        env:
          OZZIE_VIDEO_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c554986c-21eb-4603-b243-78f90afc4646.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWU5ZDg2MTYzNjU3MWZhNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTk0MzA2Mn0.3NqUS_QlriucGdwubQ9M0_CZAFLYGB44s904rlhOFCI'
        run: |
          mkdir -p public/assets
          curl --fail --location --retry 3 "$OZZIE_VIDEO_URL" --output public/assets/Ozzie2.mp4
          echo "3135f3e7a24e81c768667d111c12962d21d7dd0ddc43400d47159304ea1ad33c  public/assets/Ozzie2.mp4" | sha256sum --check -
          test "$(stat -c '%s' public/assets/Ozzie2.mp4)" = "4034431"

      - name: Commit exact video asset
        run: |
          if git ls-files --error-unmatch public/assets/Ozzie2.mp4 >/dev/null 2>&1 && git diff --quiet -- public/assets/Ozzie2.mp4; then
            echo "Exact Ozzie video is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/Ozzie2.mp4
          git commit -m "Batch 3: add exact Ozzie intro video"
          git push
