name: Verify Pull Request

# Mirrors the production test/lint/build gate without deploying.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://eefpsujuvwfkpuiejtft.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yJN6qLgpyY1E8kd8NJYGrg_qX82FT26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
