name: Ogletree Rebrand Verify

on:
  push:
    branches: [ogletree-support-workspace-rebrand]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify repo and Pages identity stayed unchanged
        run: |
          grep -F "base: '/zoom-support-navigator/'" vite.config.js
          grep -F '"name": "zoom-support-navigator"' package.json
          grep -F '"name": "zoom-support-navigator"' package-lock.json
      - name: Verify active source has no legacy OGCon label
        run: |
          if grep -R -n --exclude='*.test.*' --exclude='updatesData.json' "OGCon" src; then
            echo "Legacy OGCon label remains in active source."
            exit 1
          fi
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
