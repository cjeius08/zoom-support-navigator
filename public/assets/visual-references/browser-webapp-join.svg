<rect x="140" y="276" width="250" height="54" rx="12" fill="#24333f"/><text x="265" y="309" fill="#d8e7ef" text-anchor="middle" font-family="Arial" font-size="16">Cancel app prompt</text>
<path d="M392 303h120" stroke="#68bdf5" stroke-width="4" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#68bdf5"/></marker></defs>
<rect x="520" y="270" width="420" height="68" rx="13" fill="#0d62c8"/>
<text x="730" y="312" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Join from your browser</text>
<rect x="520" y="370" width="420" height="54" rx="10" fill="#0d141a" stroke="#415767"/>
<text x="544" y="403" fill="#9eb0bc" font-family="Arial" font-size="15">Your Name</text>
