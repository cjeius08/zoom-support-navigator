<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Zoom Web App browser join guide</title>
<desc id="d">Source-verified browser guide showing a Zoom invite launch page with Join from your browser and the name field before joining.</desc>
<rect width="1200" height="720" rx="28" fill="#0b1218"/>
<text x="48" y="58" fill="#8bd5ff" font-family="Arial" font-size="18" font-weight="700">SOURCE-VERIFIED BROWSER GUIDE</text>
<text x="48" y="92" fill="#eef8ff" font-family="Arial" font-size="28" font-weight="700">Join through the Zoom Web App</text>
<rect x="90" y="130" width="1020" height="500" rx="24" fill="#111921" stroke="#405a6d"/>
<rect x="90" y="130" width="1020" height="54" rx="24" fill="#18242d"/>
<circle cx="128" cy="157" r="8" fill="#e86666"/><circle cx="155" cy="157" r="8" fill="#e6b95e"/><circle cx="182" cy="157" r="8" fill="#63c67a"/>
<rect x="230" y="143" width="610" height="28" rx="14" fill="#0d141a"/>
<text x="260" y="163" fill="#8fa5b3" font-family="Arial" font-size="13">zoom.us / launch meeting</text>
