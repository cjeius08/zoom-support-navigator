<text x="610" y="482" fill="#fff" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Join</text>
<text x="140" y="565" fill="#93a7b5" font-family="Arial" font-size="15">If Join from your browser is missing, the host/account setting may not allow it.</text>
<text x="48" y="690" fill="#8197a7" font-family="Arial" font-size="13">Guide based on current Zoom Support flow; not a pixel-for-pixel UI reproduction.</text>
