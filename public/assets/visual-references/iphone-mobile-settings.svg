<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">iPhone Zoom settings and permissions guide</title>
<desc id="d">Source-verified iPhone guide showing Zoom Settings, Meetings, Mute My Microphone, Turn Off My Video, and iOS permissions.</desc>
<rect width="1200" height="720" rx="28" fill="#0b1218"/>
<text x="48" y="58" fill="#86ceff" font-family="Arial" font-size="18" font-weight="700">SOURCE-VERIFIED iPHONE GUIDE</text>
<text x="48" y="92" fill="#eef8ff" font-family="Arial" font-size="28" font-weight="700">Join defaults and iOS permissions</text>
<rect x="70" y="130" width="500" height="500" rx="26" fill="#121a21" stroke="#405a6d"/>
<text x="100" y="170" fill="#eef8ff" font-family="Arial" font-size="22" font-weight="700">Zoom → Settings → Meetings</text>
<text x="100" y="218" fill="#b6c7d3" font-family="Arial" font-size="16">Mute My Microphone</text>
<rect x="445" y="196" width="72" height="34" rx="17" fill="#1986f2"/><circle cx="500" cy="213" r="14" fill="#fff"/>
<text x="100" y="272" fill="#b6c7d3" font-family="Arial" font-size="16">Turn Off My Video</text>
<rect x="445" y="250" width="72" height="34" rx="17" fill="#1986f2"/><circle cx="500" cy="267" r="14" fill="#fff"/>
<text x="100" y="330" fill="#8197a7" font-family="Arial" font-size="14">These are default join preferences.</text>
<text x="100" y="360" fill="#8197a7" font-family="Arial" font-size="14">One-time Join Options are separate.</text>
<rect x="630" y="130" width="500" height="500" rx="26" fill="#121a21" stroke="#405a6d"/>
<text x="660" y="170" fill="#eef8ff" font-family="Arial" font-size="22" font-weight="700">iPhone Settings → Zoom</text>
<text x="660" y="220" fill="#b6c7d3" font-family="Arial" font-size="16">Microphone</text>
<rect x="1000" y="198" width="72" height="34" rx="17" fill="#29b765"/><circle cx="1055" cy="215" r="14" fill="#fff"/>
<text x="660" y="274" fill="#b6c7d3" font-family="Arial" font-size="16">Camera</text>
<rect x="1000" y="252" width="72" height="34" rx="17" fill="#29b765"/><circle cx="1055" cy="269" r="14" fill="#fff"/>
<text x="660" y="332" fill="#b6c7d3" font-family="Arial" font-size="16">Photos / Notifications / Local Network</text>
<text x="660" y="378" fill="#8197a7" font-family="Arial" font-size="14">Only change the permission that matches</text>
<text x="660" y="402" fill="#8197a7" font-family="Arial" font-size="14">the caller’s actual symptom.</text>
<text x="48" y="690" fill="#8197a7" font-family="Arial" font-size="13">Guide based on current Zoom Support labels and iOS permission flow; not a pixel-for-pixel UI reproduction.</text>
</svg>